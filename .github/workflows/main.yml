name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Buildozer dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev tk-dev libgdbm-compat-dev libreoffice-dev libmpdec-dev
        pip3 install --upgrade pip
        pip3 install buildozer cython virtualenv

    - name: Set up Android SDK & Accept Licenses
      uses: android-actions/setup-android@v4

    - name: Build with Buildozer
      run: |
        if [ ! -f buildozer.spec ]; then
          buildozer init
        fi
        
        # buildozer.spec ফাইলটি এডিট করে সিস্টেমের SDK পাথগুলো জোরপূর্বক বসানো হচ্ছে
        sed -i 's|# (str) Android SDK directory|android.sdk_dir = /usr/local/lib/android/sdk|' buildozer.spec
        sed -i 's|# (str) Android NDK directory|android.ndk_dir = /usr/local/lib/android/sdk/ndk-bundle|' buildozer.spec
        sed -i 's|# (int) Android API to use|android.api = 34|' buildozer.spec
        sed -i 's|# (str) Android build tools version|android.build_tools_version = 34.0.0|' buildozer.spec
        
        buildozer android debug
      env:
        # বিল্ডোজারকে গ্লোবাল এনভায়রনমেন্টের পাথগুলো চিনিয়ে দেওয়া হচ্ছে
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        ANDROID_HOME: /usr/local/lib/android/sdk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: snake-game-apk
        path: bin/*.apk
        
