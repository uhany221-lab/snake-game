name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Buildozer dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev tk-dev libgdbm-compat-dev libreoffice-dev libmpdec-dev
        pip3 install --upgrade pip
        pip3 install buildozer cython virtualenv

    # একদম নতুন এবং অফিশিয়াল উপায়ে অ্যান্ড্রয়েড SDK এবং লাইসেন্স সেটআপ করা হচ্ছে
    - name: Set up Android SDK & Accept Licenses
      uses: android-actions/setup-android@v4

    - name: Build with Buildozer
      run: |
        if [ ! -f buildozer.spec ]; then
          buildozer init
        fi
        
        # বিল্ডোজারকে নির্দেশ দেওয়া হচ্ছে যেন সে সিস্টেমের অফিশিয়াল SDK ব্যবহার করে
        buildozer android debug
      env:
        ANDROID_SDK_HOME: /usr/local/lib/android/sdk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: snake-game-apk
        path: bin/*.apk
        
