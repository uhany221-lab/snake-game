name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # রানারের জাভা ভার্সন ১১ থেকে ১৭ তে সেট করা হচ্ছে
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Buildozer dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev tk-dev libgdbm-compat-dev libreoffice-dev libmpdec-dev
        pip3 install --upgrade pip
        pip3 install buildozer cython virtualenv

    # এখন জাভা ১৭ অ্যাক্টিভ থাকায় এটি নিখুঁতভাবে লাইসেন্স অ্যাক্সেপ্ট করবে
    - name: Set up Android SDK & Accept Licenses
      uses: android-actions/setup-android@v4

    - name: Build with Buildozer
      run: |
        if [ ! -f buildozer.spec ]; then
          buildozer init
        fi
        
        buildozer android debug
      env:
        ANDROID_SDK_HOME: /usr/local/lib/android/sdk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: snake-game-apk
        path: bin/*.apk
        
